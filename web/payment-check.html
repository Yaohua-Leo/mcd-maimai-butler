<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麦麦管家 · 付款链路验证</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
    body { margin: 0; padding: 24px; color: #2d251f; background: #fff8f0; }
    main { max-width: 560px; margin: 0 auto; padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 12px 34px #61371f12; }
    h1 { margin-top: 0; font-size: 26px; }
    p { line-height: 1.7; color: #766555; }
    label { display: block; margin: 22px 0 8px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #edc8ba; border-radius: 12px; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 12px; color: #fff; background: #c83728; font-size: 16px; }
    .notice { padding: 12px; border-radius: 12px; background: #fff3d7; color: #795e46; }
  </style>
</head>
<body>
  <main>
    <h1>付款链路兼容性验证</h1>
    <p>本页面只用于受控测试麦当劳官方付款链接在手机浏览器中的打开和返回行为。麦麦管家不收取餐费。</p>
    <p class="notice">不要把含有真实订单号的链接放入截图、日志、公开 Issue 或聊天记录。当前推荐版不会生成真实订单。</p>
    <label for="url">受控测试链接</label>
    <input id="url" type="url" placeholder="仅在获得批准的测试订单后粘贴">
    <button id="open" type="button">打开官方付款链接</button>
    <p id="status" aria-live="polite">G2 订单闭环尚未通过。</p>
  </main>
  <script>
    document.getElementById('open').addEventListener('click', function () {
      const input = document.getElementById('url');
      const status = document.getElementById('status');
      let value;
      try { value = new URL(input.value).toString(); } catch (_) {
        status.textContent = '请输入完整的 https:// 链接。';
        return;
      }
      if (new URL(value).protocol !== 'https:') {
        status.textContent = '为避免误开不安全地址，只允许 https:// 链接。';
        return;
      }
      status.textContent = '正在打开官方链接；支付结果必须回到订单查询确认。';
      window.location.assign(value);
    });
  </script>
</body>
</html>
